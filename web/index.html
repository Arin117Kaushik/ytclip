<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ytclip</title>
<style>
  :root {
    --black: #000000;
    --panel: #181818;
    --field: #161616;
    --white: #ffffff;
    --muted: #b3b3b3;
    --border: #333333;
    --field-border: #666666;
    --red: #e50914;
    --red-hover: #c11119;
    --error: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font: 16px/1.5 "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 4vw, 24px) 48px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .lede { margin: 0 0 32px; color: var(--muted); }
  form { display: grid; gap: 16px; }
  label, legend { display: block; margin-bottom: 4px; padding: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  input, select {
    width: 100%;
    min-height: 56px;
    padding: 16px;
    background: var(--field);
    color: var(--white);
    border: 1px solid var(--field-border);
    border-radius: 4px;
    font: inherit;
  }
  input::placeholder { color: #8c8c8c; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
  }
  .check { display: flex; align-items: center; gap: 12px; min-height: 48px; margin: 0; font-size: 16px; font-weight: 400; cursor: pointer; }
  .check input { width: 22px; height: 22px; min-height: 0; padding: 0; flex: none; accent-color: var(--white); }
  .pair { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

  button {
    min-height: 48px;
    padding: 0 24px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 4px;
    font: 600 18px/1 "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  button:hover { background: var(--red-hover); }
  button:active { background: #99161d; }
  button:disabled { background: #6d6d6e; cursor: default; }
  button.second { min-height: 44px; padding: 0 16px; background: rgba(109, 109, 110, 0.7); font-size: 15px; }
  button.second:hover { background: rgba(109, 109, 110, 0.5); }
  button.second:active { background: rgba(109, 109, 110, 0.35); }

  .panel { padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .video { display: grid; grid-template-columns: 160px 1fr; gap: 16px; align-items: center; }
  .video img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; }
  .video h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .video p, .note, figcaption { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 420px) { .video { grid-template-columns: 1fr; } }

  #clips { display: grid; gap: 16px; }
  fieldset { min-width: 0; margin: 0; border: none; padding: 0; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; }
  .frames img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: var(--field); border-radius: 4px; display: block; }

  .folder { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .folder p { margin: 0; overflow-wrap: anywhere; }
  .folder span { display: block; color: var(--muted); font-size: 13px; }

  .status { min-height: 24px; margin: 0; overflow-wrap: anywhere; }
  .status.bad { color: var(--error); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--white); transition: width 0.3s linear; }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Clip a YouTube video</h1>
  <p class="lede">Paste a link, pick the parts you want, and save only those.</p>

  <form id="form" novalidate>
    <div>
      <label for="url">YouTube link</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://youtu.be/..." required>
    </div>

    <div class="video panel" id="video" hidden>
      <img id="thumb" alt="" width="320" height="180">
      <div>
        <h2 id="title"></h2>
        <p id="length"></p>
      </div>
    </div>
    <p class="note" id="lookup" role="status" hidden></p>

    <label class="check" for="whole">
      <input id="whole" type="checkbox">
      Download the whole video
    </label>

    <div id="clips" class="cut"></div>
    <div class="row cut">
      <button type="button" class="second" id="add">Add another clip</button>
    </div>
    <p class="note cut">Times can be seconds (90), minutes (1:30) or hours (1:02:03).</p>

    <div class="pair">
      <div>
        <label for="res">Quality</label>
        <select id="res">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
        </select>
      </div>
      <div>
        <label for="mode">Save as</label>
        <select id="mode">
          <option value="video">Video</option>
          <option value="vertical">Vertical video (9:16)</option>
          <option value="audio">Sound only (mp3)</option>
        </select>
      </div>
    </div>

    <div class="folder panel" id="folder" hidden>
      <p><span>Save to</span><b id="folderName"></b></p>
      <button type="button" class="second" id="pick">Change</button>
    </div>

    <button id="go" type="submit">Download clip</button>

    <div class="bar" id="progress" hidden><div id="fill"></div></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<template id="clipRow">
  <fieldset>
    <legend></legend>
    <div class="pair">
      <div>
        <label>Start</label>
        <input data-is="start" inputmode="decimal" autocomplete="off" placeholder="1:30">
      </div>
      <div>
        <label>End</label>
        <input data-is="end" inputmode="decimal" autocomplete="off" placeholder="2:00">
      </div>
    </div>
    <div class="row">
      <button type="button" class="second" data-is="preview">Preview</button>
      <button type="button" class="second" data-is="remove">Remove</button>
      <span class="note" data-is="note" role="status"></span>
    </div>
    <div class="frames" hidden>
      <figure><img data-is="first" alt="First frame of this clip" width="640" height="360"><figcaption>Starts here</figcaption></figure>
      <figure><img data-is="last" alt="Last frame of this clip" width="640" height="360"><figcaption>Ends here</figcaption></figure>
    </div>
  </fieldset>
</template>

<script>
const $ = (id) => document.getElementById(id);
const TIME = /^\d+(:\d{1,2}){0,2}(\.\d+)?$/;
let video = null;   // details of the link currently in the box
let folder = null;  // the folder on this computer that downloads go to, or null on a phone
let lookupTimer = 0;
let rowCount = 0;

const seconds = (text) => text.trim().split(":").reduce((total, part) => total * 60 + Number(part), 0);
const clock = (s) => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
};
const link = () => $("url").value.trim();
const rows = () => [...$("clips").children];
const part = (row, name) => row.querySelector(`[data-is="${name}"]`);

async function post(path, data) {
  const reply = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  if (!reply.ok) throw new Error((await reply.json()).error || "Something went wrong");
  return reply;
}

function status(text, bad = false) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", bad);
}

/* Settings that stick between visits. Private windows can refuse storage, so failures are ignored. */
for (const id of ["res", "mode"]) {
  try { $(id).value = localStorage.getItem(id) || $(id).value; } catch {}
  $(id).addEventListener("change", () => { try { localStorage.setItem(id, $(id).value); } catch {} });
}

/* On this computer the app writes the file itself, since browsers may not write to Downloads.
   A phone on the Wi-Fi has no folder here, so it gets a normal browser download. */
async function loadFolder(pick = false) {
  folder = (await (await post("/api/folder", { pick })).json()).folder;
  $("folder").hidden = !folder;
  $("folderName").textContent = folder || "";
}
loadFolder().catch(() => {});
$("pick").addEventListener("click", async () => {
  $("pick").disabled = true;  // the folder dialog is open
  await loadFolder(true).catch((err) => status(err.message, true));
  $("pick").disabled = false;
});

/* Clip rows */
function addRow() {
  const row = $("clipRow").content.firstElementChild.cloneNode(true);
  rowCount += 1;
  for (const name of ["start", "end"]) {
    const input = part(row, name);
    input.id = name + rowCount;
    input.previousElementSibling.htmlFor = input.id;
    input.addEventListener("input", () => { row.querySelector(".frames").hidden = true; });
  }
  part(row, "remove").addEventListener("click", () => { row.remove(); renumber(); });
  part(row, "preview").addEventListener("click", () => preview(row));
  $("clips").append(row);
  renumber();
  return row;
}

function renumber() {
  const all = rows();
  all.forEach((row, i) => {
    row.querySelector("legend").textContent = "Clip " + (i + 1);
    row.querySelector("legend").hidden = all.length === 1;
    part(row, "remove").hidden = all.length === 1;
  });
  nameButton();
}

function nameButton() {
  const count = rows().length;
  $("go").textContent = $("whole").checked ? "Download video" : count > 1 ? `Download ${count} clips` : "Download clip";
}

/* Returns what is wrong with a row's times, or "" when they are fine. */
function problemWith(row) {
  const start = part(row, "start").value.trim(), end = part(row, "end").value.trim();
  if (!TIME.test(start) || !TIME.test(end)) return "Enter the start and end as 90, 1:30 or 1:02:03.";
  if (seconds(end) <= seconds(start)) return "The end has to be after the start.";
  if (video && video.duration && seconds(end) > video.duration + 0.5) return "The end is past the end of the video (" + clock(video.duration) + ").";
  return "";
}

async function preview(row) {
  const note = part(row, "note");
  const problem = !link() ? "Paste a YouTube link first." : problemWith(row);
  if (problem) { note.textContent = problem; return; }
  note.textContent = "Getting the frames...";
  const start = seconds(part(row, "start").value), end = seconds(part(row, "end").value);
  const shot = async (at) => URL.createObjectURL(await (await post("/api/frame", { url: link(), res: Number($("res").value), at })).blob());
  try {
    // The end frame is taken just before END, since END itself is the first frame left out.
    const [first, last] = await Promise.all([shot(start), shot(Math.max(start, end - 0.05))]);
    part(row, "first").src = first;
    part(row, "last").src = last;
    row.querySelector(".frames").hidden = false;
    note.textContent = "";
  } catch (err) {
    note.textContent = "Could not get the frames. " + err.message;
  }
}

/* Link box */
async function lookUp() {
  const url = link();
  $("video").hidden = true;
  if (!/^https?:\/\/\S+\.\S+/.test(url)) { $("lookup").hidden = true; return; }
  // A link copied "at current time" carries the moment in it. Use it as the first clip's start.
  const at = url.match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/);
  const from = at ? (at[1] || 0) * 3600 + (at[2] || 0) * 60 + Number(at[3] || 0) : 0;
  const firstStart = part(rows()[0], "start");
  if (from && !firstStart.value) firstStart.value = clock(from);

  $("lookup").hidden = false;
  $("lookup").textContent = "Looking up the video...";
  try {
    const found = await (await post("/api/info", { url, res: Number($("res").value) })).json();
    if (link() !== url) return;  // the link changed while we waited
    video = found;
    $("title").textContent = found.title;
    $("length").textContent = found.duration ? clock(found.duration) + " long" : "";
    $("thumb").src = found.thumbnail || "";
    $("thumb").hidden = !found.thumbnail;
    $("video").hidden = false;
    $("lookup").hidden = true;
  } catch (err) {
    $("lookup").textContent = "Could not read that link. " + err.message;
  }
}

$("url").addEventListener("input", () => {
  video = null;
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(lookUp, 500);
});

$("add").addEventListener("click", () => part(addRow(), "start").focus());

$("whole").addEventListener("change", () => {
  document.querySelectorAll(".cut").forEach((el) => { el.hidden = $("whole").checked; });
  nameButton();
  status("");
});

/* Download */
async function waitFor(job, tag) {
  for (;;) {
    await new Promise((r) => setTimeout(r, 700));
    const now = await (await fetch("/api/job/" + job)).json();
    if (now.state === "error") throw new Error(now.error);
    if (now.state === "done") return now;
    status(tag + now.step + (now.percent ? " " + now.percent + "%" : ""));
    $("fill").style.width = now.percent + "%";
  }
}

function save(job, done) {
  if (done.saved) return;  // already written into the folder
  Object.assign(document.createElement("a"), { href: "/api/file/" + job, download: done.name }).click();
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!link()) return status("Paste a YouTube link first.", true);
  const whole = $("whole").checked;
  const jobs = whole ? [{ whole }] : rows().map((row) => ({ start: part(row, "start").value.trim(), end: part(row, "end").value.trim() }));
  if (!whole) {
    for (const [i, row] of rows().entries()) {
      const problem = problemWith(row);
      if (problem) return status((jobs.length > 1 ? `Clip ${i + 1}: ` : "") + problem, true);
    }
  }
  $("go").disabled = true;
  $("progress").hidden = false;
  const failed = [];
  let lastName = "", inFolder = false;
  for (const [i, job] of jobs.entries()) {
    const tag = jobs.length > 1 ? `Clip ${i + 1} of ${jobs.length}: ` : "";
    $("fill").style.width = "0%";
    status(tag + "Starting...");
    try {
      const started = await (await post("/api/clip", { url: link(), res: Number($("res").value), mode: $("mode").value, ...job })).json();
      const done = await waitFor(started.job, tag);
      save(started.job, done);
      lastName = done.name;
      inFolder = done.saved;
    } catch (err) {
      failed.push((jobs.length > 1 ? `Clip ${i + 1}: ` : "") + err.message);
    }
  }
  $("go").disabled = false;
  const saved = jobs.length - failed.length;
  $("fill").style.width = saved ? "100%" : "0%";
  $("progress").hidden = !saved;
  const where = inFolder ? " to " + (folder || "your folder") : ". Your browser is saving it";
  const what = saved === 1 ? lastName : saved + " files";
  if (!failed.length) status("Saved " + what + where + ".");
  else status((saved ? "Saved " + what + where + ". " : "") + "That did not work. " + failed.join(" "), true);
});

addRow();
</script>
</body>
</html>
