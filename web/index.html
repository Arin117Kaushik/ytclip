<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ytclip</title>
<style>
  :root {
    --black: #000000;
    --panel: #181818;
    --field: #161616;
    --white: #ffffff;
    --muted: #b3b3b3;
    --border: #333333;
    --field-border: #666666;
    --red: #e50914;
    --red-hover: #c11119;
    --error: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font: 16px/1.5 "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 4vw, 24px) 48px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .lede { margin: 0 0 32px; color: var(--muted); }
  form { display: grid; gap: 16px; }
  label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  input, select {
    width: 100%;
    min-height: 56px;
    padding: 16px;
    background: var(--field);
    color: var(--white);
    border: 1px solid var(--field-border);
    border-radius: 4px;
    font: inherit;
  }
  input::placeholder { color: #8c8c8c; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
  }
  .times { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  button {
    min-height: 48px;
    padding: 0 24px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 4px;
    font: 600 18px/1 "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  button:hover { background: var(--red-hover); }
  button:active { background: #99161d; }
  button:disabled { background: #6d6d6e; cursor: default; }

  .video {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 16px;
    align-items: center;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .video img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; }
  .video h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .video p, .note { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 420px) { .video { grid-template-columns: 1fr; } }

  .status { min-height: 24px; overflow-wrap: anywhere; }
  .status.bad { color: var(--error); }
  .bar { height: 4px; margin-top: 8px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--white); transition: width 0.3s linear; }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
  a { color: var(--white); display: inline-block; padding: 12px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Clip a YouTube video</h1>
  <p class="lede">Paste a link, pick the start and end, and save only that part.</p>

  <form id="form" novalidate>
    <div>
      <label for="url">YouTube link</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://youtu.be/..." required>
    </div>

    <div class="video" id="video" hidden>
      <img id="thumb" alt="" width="320" height="180">
      <div>
        <h2 id="title"></h2>
        <p id="length"></p>
      </div>
    </div>
    <p class="note" id="lookup" role="status" hidden></p>

    <div class="times">
      <div>
        <label for="start">Start</label>
        <input id="start" inputmode="decimal" autocomplete="off" placeholder="1:30" required>
      </div>
      <div>
        <label for="end">End</label>
        <input id="end" inputmode="decimal" autocomplete="off" placeholder="2:00" required>
      </div>
      <div>
        <label for="res">Quality</label>
        <select id="res">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
        </select>
      </div>
    </div>
    <p class="note">Times can be seconds (90), minutes (1:30) or hours (1:02:03).</p>

    <button id="go" type="submit">Download clip</button>

    <div id="progress" hidden>
      <div class="bar"><div id="fill"></div></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TIME = /^\d+(:\d{1,2}){0,2}(\.\d+)?$/;
let video = null;  // details of the link currently in the box
let lookupTimer = 0;

const seconds = (text) => text.trim().split(":").reduce((total, part) => total * 60 + Number(part), 0);
const clock = (s) => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
};
// Same shape as label() in clip.py, so names match the terminal tool.
const stamp = (s) => Math.floor(s / 60) + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s";

async function post(path, data) {
  const reply = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const body = await reply.json();
  if (!reply.ok) throw new Error(body.error || "Something went wrong");
  return body;
}

function status(text, bad = false) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", bad);
}

async function lookUp() {
  const url = $("url").value.trim();
  video = null;
  $("video").hidden = true;
  if (!/^https?:\/\/\S+\.\S+/.test(url)) { $("lookup").hidden = true; return; }
  $("lookup").hidden = false;
  $("lookup").textContent = "Looking up the video...";
  try {
    const found = await post("/api/info", { url, res: Number($("res").value) });
    if ($("url").value.trim() !== url) return;  // the link changed while we waited
    video = found;
    $("title").textContent = found.title;
    $("length").textContent = found.duration ? clock(found.duration) + " long" : "";
    $("thumb").src = found.thumbnail || "";
    $("thumb").hidden = !found.thumbnail;
    $("video").hidden = false;
    $("lookup").hidden = true;
  } catch (err) {
    $("lookup").textContent = "Could not read that link. " + err.message;
  }
}

$("url").addEventListener("input", () => {
  video = null;
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(lookUp, 500);
});

function problemWithTimes() {
  const start = $("start").value.trim(), end = $("end").value.trim();
  if (!$("url").value.trim()) return "Paste a YouTube link first.";
  if (!TIME.test(start) || !TIME.test(end)) return "Enter the start and end as 90, 1:30 or 1:02:03.";
  if (seconds(end) <= seconds(start)) return "The end has to be after the start.";
  if (video && video.duration && seconds(end) > video.duration + 0.5) return "The end is past the end of the video (" + clock(video.duration) + ").";
  return "";
}

async function waitFor(job) {
  for (;;) {
    await new Promise((r) => setTimeout(r, 700));
    const now = await (await fetch("/api/job/" + job)).json();
    if (now.state === "error") throw new Error(now.error);
    if (now.state === "done") return now;
    status(now.step + (now.percent ? " " + now.percent + "%" : ""));
    $("fill").style.width = now.percent + "%";
  }
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const problem = problemWithTimes();
  if (problem) return status(problem, true);

  const start = $("start").value.trim(), end = $("end").value.trim();
  const suggested = (video ? video.name : "clip") + " [" + stamp(seconds(start)) + "-" + stamp(seconds(end)) + "].mp4";

  // Chrome and Edge on a computer can ask where to save. It must be asked right on the click.
  let target = null;
  if (window.showSaveFilePicker) {
    try {
      target = await showSaveFilePicker({ suggestedName: suggested, types: [{ description: "MP4 video", accept: { "video/mp4": [".mp4"] } }] });
    } catch (err) {
      if (err.name === "AbortError") return;  // closed the dialog
    }
  }

  $("go").disabled = true;
  $("progress").hidden = false;
  $("fill").style.width = "0%";
  status("Starting...");
  try {
    const { job } = await post("/api/clip", { url: $("url").value.trim(), start, end, res: Number($("res").value) });
    const done = await waitFor(job);
    $("fill").style.width = "100%";
    const file = "/api/file/" + job;
    if (target) {
      status("Saving...");
      const reply = await fetch(file);
      if (!reply.ok) throw new Error("The finished clip could not be read back.");
      await reply.body.pipeTo(await target.createWritable());
      status("Saved as " + target.name);
    } else {
      const link = Object.assign(document.createElement("a"), { href: file, download: done.name });
      link.click();
      $("status").textContent = "Clip ready. Your browser is saving it. ";
      $("status").classList.remove("bad");
      $("status").append(Object.assign(document.createElement("a"), { href: file, download: done.name, textContent: "Save again" }));
    }
  } catch (err) {
    status("That did not work. " + err.message, true);
    $("progress").hidden = true;
    // The save dialog already created an empty file where the clip was meant to go.
    if (target && target.remove) await target.remove().catch(() => {});
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
